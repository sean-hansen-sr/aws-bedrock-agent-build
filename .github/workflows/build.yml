name: 'Build to AWS ECR'

on: 
  push:
    branches:
      - main
  
jobs:
  login-to-AWS:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.REGION }}
  build-and-push-ECR:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
      - name: Login to AWS ECR
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.ACCESS_KEY }}
          password: ${{ secrets.SECRET_ACCESS_KEY }}
        env:
          aws-region: ${{ secrets.REGION }}
      - name: Build Image
        env:
          BUILD: ${{ secrets.DOCKER_BUILD }}
          TAG: ${{ secrets.DOCKER_TAG }}
          PUSH: ${{ secrets.DOCKER_PUSH }}
          APP_ENV: "development"
          APP_AWS_REGION: ${{ secrets.REGION }}
          APP_MODEL_ID: ${{ secrets.APP_MODEL_ID }}
          APP_AGENT_TABLE_NAME: ${{ secrets.APP_AGENT_TABLE_NAME }}
        run: |
          docker build \
            --build-arg APP_ENV=$APP_ENV \
            --build-arg APP_AWS_REGION=$APP_AWS_REGION \
            --build-arg APP_MODEL_ID=$APP_MODEL_ID \
            --build-arg APP_AGENT_TABLE_NAME=$APP_AGENT_TABLE_NAME \
            -t $BUILD .
          docker tag $TAG
          docker push $PUSH
